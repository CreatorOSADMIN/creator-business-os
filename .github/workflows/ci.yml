name: CI

on:
push:
branches: [main]
pull_request:
branches: [main]

env:
DATABASE_URL: ${{ secrets.DATABASE_URL }}
SESSION_SECRET: "ci-placeholder-session-secret-value"
ADMIN_EMAIL: "[admin@example.com](mailto:admin@example.com)"
ADMIN_PASSWORD: "ci-placeholder-password"
EMAIL_PROVIDER: "console"
EMAIL_FROM: "CreatorOS [hello@example.com](mailto:hello@example.com)"
NEXT_PUBLIC_SITE_URL: "http://localhost:3000"

jobs:
ci:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Node
    uses: actions/setup-node@v4
    with:
      node-version: "22"
      cache: "npm"

  - name: Install dependencies
    run: npm ci

  - name: Generate Prisma client
    run: npx prisma generate

  - name: Lint
    run: npm run lint

  - name: Test
    run: npm run test

  - name: Build
    run: npm run build
```
