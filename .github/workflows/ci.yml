name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No database is provisioned in this pipeline: build/test/lint never need a
# live connection. DATABASE_URL below is a syntactically valid but unreachable
# placeholder, only used so `prisma generate` and our env validation are
# satisfied. Real secrets live in GitHub Actions repo/environment secrets,
# never in this file.
env:
  DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci_placeholder"
  SESSION_SECRET: "ci-placeholder-session-secret-value"
  ADMIN_EMAIL: "admin@example.com"
  ADMIN_PASSWORD: "ci-placeholder-password"
  EMAIL_PROVIDER: "console"
  EMAIL_FROM: "CreatorOS <hello@example.com>"
  NEXT_PUBLIC_SITE_URL: "http://localhost:3000"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
